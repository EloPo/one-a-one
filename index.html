<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bora marcar nosso 1:1?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3147E0;
    --paper: #FFFFFF;
    --ink: #151A3D;
    --muted: #5B6290;
    --yes: #FFD23F;
    --yes-ink: #151A3D;
    --no: #E9ECFB;
    --ring: #FFD23F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141B4D;
      --paper: #1F2766;
      --ink: #F3F4FF;
      --muted: #AEB4E8;
      --no: #2E3780;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141B4D;
    --paper: #1F2766;
    --ink: #F3F4FF;
    --muted: #AEB4E8;
    --no: #2E3780;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 1.25rem;
  }

  .convite {
    position: relative;
    width: min(100%, 30rem);
    background: var(--paper);
    border-radius: 1.75rem;
    padding: 0 0 2rem;
    box-shadow: 0 0.6rem 0 rgba(0,0,0,0.18);
    text-align: center;
    overflow: hidden;
  }

  /* Topo estilo folhinha de calendário */
  .folhinha {
    background: var(--yes);
    color: var(--yes-ink);
    padding: 1.1rem 1rem 0.9rem;
    position: relative;
  }
  .folhinha::before, .folhinha::after {
    content: "";
    position: absolute;
    top: -0.5rem;
    width: 0.9rem; height: 1.6rem;
    background: var(--ink);
    border-radius: 999px;
  }
  .folhinha::before { left: 28%; }
  .folhinha::after { right: 28%; }
  .folhinha .grande {
    font-size: clamp(4rem, 18vw, 6.5rem);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.04em;
    display: block;
  }
  .folhinha .pequeno {
    font-size: 1rem;
    font-weight: 600;
  }

  h1 {
    font-size: clamp(1.7rem, 6vw, 2.3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 1.75rem 1.5rem 0.5rem;
  }
  p.sub {
    margin: 0 1.5rem 1.75rem;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.45;
  }

  .botoes {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 0 1.5rem;
    min-height: 3.5rem;
  }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    border: none;
    border-radius: 999px;
    padding: 0.85rem 2.2rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 3px;
  }
  #sim {
    background: var(--yes);
    color: var(--yes-ink);
    box-shadow: 0 0.3rem 0 #C99A00;
    transition: transform 0.12s ease;
  }
  #sim:hover { transform: translateY(-2px) rotate(-2deg); }
  #sim:active { transform: translateY(2px); box-shadow: 0 0.1rem 0 #C99A00; }
  #nao {
    background: var(--no);
    color: var(--ink);
    z-index: 10;
  }
  #nao.fugindo {
    position: fixed;
    transition: left 0.22s ease-out, top 0.22s ease-out;
  }

  .provocacao {
    margin: 1rem 1.5rem 0;
    min-height: 1.4em;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Tela de sucesso */
  .sucesso { display: none; }
  .convite.agendado .pergunta { display: none; }
  .convite.agendado .sucesso {
    display: block;
    animation: surge 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  .sucesso h1 { margin-top: 1.75rem; }
  .check {
    width: 4.5rem; height: 4.5rem;
    margin: 1.75rem auto 0;
    border-radius: 50%;
    background: var(--yes);
    display: grid; place-items: center;
  }
  .check svg { width: 2.4rem; height: 2.4rem; }
  @keyframes surge {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #nao.fugindo { transition: none; }
    .convite.agendado .sucesso { animation: none; }
  }
</style>
</head>
<body>
  <main class="convite" id="convite">
    <div class="folhinha" aria-hidden="true">
      <span class="grande">1:1</span>
      <span class="pequeno">só nós dois, 30 minutinhos</span>
    </div>

    <section class="pergunta">
      <h1>Bora marcar nosso 1:1?</h1>
      <p class="sub">Pensa bem antes de responder. Ou nem pensa, só clica no sim.</p>
      <div class="botoes">
        <button id="sim" type="button">Sim</button>
        <button id="nao" type="button">Não</button>
      </div>
      <p class="provocacao" id="provocacao" aria-live="polite"></p>
    </section>

    <section class="sucesso" aria-live="polite">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#151A3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1>Seu 1:1 foi agendado!</h1>
      <p class="sub">Já pode ir separando os assuntos. Até lá!</p>
    </section>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
  const nao = document.getElementById('nao');
  const sim = document.getElementById('sim');
  const convite = document.getElementById('convite');
  const provocacao = document.getElementById('provocacao');
  const reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const frases = [
    'Quase! Tenta de novo.',
    'Esse botão é meio tímido.',
    'Ele não quer ser clicado.',
    'O "sim" está bem ali, parado, esperando.',
    'Você é persistente, hein.',
    'Tá vendo? Nem o botão concorda.',
    'Ok, isso já virou esporte.'
  ];
  let tentativas = 0;

  function fugir() {
    const r = nao.getBoundingClientRect();
    if (!nao.classList.contains('fugindo')) {
      // Deixa um espaço no lugar original para o "sim" não pular
      const vaga = document.createElement('span');
      vaga.style.width = r.width + 'px';
      vaga.style.display = 'inline-block';
      nao.parentNode.insertBefore(vaga, nao);
      nao.style.left = r.left + 'px';
      nao.style.top = r.top + 'px';
      nao.classList.add('fugindo');
      void nao.offsetWidth;
    }
    const margem = 16;
    const maxX = window.innerWidth - r.width - margem;
    const maxY = window.innerHeight - r.height - margem;
    let x, y, tentativa = 0;
    // Evita cair perto de onde estava
    do {
      x = margem + Math.random() * Math.max(0, maxX - margem);
      y = margem + Math.random() * Math.max(0, maxY - margem);
      tentativa++;
    } while (Math.hypot(x - r.left, y - r.top) < 140 && tentativa < 20);
    nao.style.left = x + 'px';
    nao.style.top = y + 'px';

    provocacao.textContent = frases[tentativas % frases.length];
    tentativas++;
  }

  nao.addEventListener('mouseenter', fugir);
  nao.addEventListener('pointerdown', (e) => { e.preventDefault(); fugir(); });
  nao.addEventListener('touchstart', (e) => { e.preventDefault(); fugir(); }, { passive: false });
  nao.addEventListener('click', (e) => { e.preventDefault(); fugir(); });
  nao.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fugir(); }
  });

  function chuvaDeConfete() {
    if (typeof confetti !== 'function') return;
    const cores = ['#FFD23F', '#3147E0', '#FF5DA2', '#2BD9A6', '#FFFFFF'];
    if (reduzido) {
      confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 }, colors: cores });
      return;
    }
    // Explosão inicial
    confetti({ particleCount: 160, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: cores });
    // Chuva caindo do topo por alguns segundos
    const fim = Date.now() + 4000;
    (function chover() {
      confetti({
        particleCount: 6,
        angle: 270,
        spread: 60,
        startVelocity: 10,
        gravity: 0.9,
        ticks: 300,
        origin: { x: Math.random(), y: -0.05 },
        colors: cores
      });
      if (Date.now() < fim) requestAnimationFrame(chover);
    })();
  }

  sim.addEventListener('click', () => {
    nao.remove();
    convite.classList.add('agendado');
    chuvaDeConfete();
  });

  window.addEventListener('resize', () => {
    if (nao.isConnected && nao.classList.contains('fugindo')) {
      const r = nao.getBoundingClientRect();
      if (r.right > window.innerWidth || r.bottom > window.innerHeight) fugir();
    }
  });
</script>
</body>
</html>
